<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#070d26;--card:#101a45;--card2:#16235a;--line:#2a3b86;--txt:#eef2ff;--mut:#9fb0ea;--blue:#3d6bff;--blue2:#2547c9;--org:#ff8a1f;--org2:#d96a00;--grn:#27c783;--red:#ff4d63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--txt);background:radial-gradient(900px 500px at 85% -5%,#3d6bff40,transparent),radial-gradient(700px 500px at -5% 30%,#ff8a1f26,transparent),var(--bg);min-height:100vh}
a{color:inherit}
.view{display:none;animation:fade .35s}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:1250px;margin:auto;padding:18px}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:#070d26ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .in{max-width:1250px;margin:auto;padding:8px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.brand img{width:54px;height:54px;border-radius:14px;box-shadow:0 4px 0 #0a1233,0 8px 14px #0008;border:2px solid #ffffff30;flex:none}
.brand .t1{font-weight:800;font-size:clamp(13px,2.3vw,19px);letter-spacing:.6px;line-height:1.15;text-transform:uppercase}
.brand .t2{font-weight:900;font-size:clamp(22px,4vw,32px);letter-spacing:5px;line-height:1.05;background:linear-gradient(180deg,#fff2c9 0%,#ffb347 45%,#ff7a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #7d3d00) drop-shadow(0 4px 6px #000a);-webkit-text-stroke:.6px #ffd9a0}
.menu{margin-left:auto;display:flex;gap:4px;align-items:center}
.menu a{padding:8px 12px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:var(--mut);cursor:pointer;white-space:nowrap}
.menu a:hover,.menu a.on{color:#fff;background:#ffffff14}
.burger{display:none;margin-left:auto}
@media(max-width:900px){.burger{display:block}.menu{display:none;position:absolute;left:0;right:0;top:100%;background:#0a1233;flex-direction:column;align-items:stretch;padding:10px 18px;border-bottom:1px solid var(--line)}.menu.open{display:flex}}
#sync{display:none;font-size:10px;padding:3px 8px;border-radius:99px;background:#ffffff14;color:var(--mut);white-space:nowrap}
/* buttons */
.btn{appearance:none;border:0;cursor:pointer;color:#fff;font:600 14px Poppins,sans-serif;padding:11px 18px;border-radius:13px;background:linear-gradient(180deg,#5f86ff,var(--blue2));box-shadow:0 5px 0 #17307f,0 10px 16px #0007;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #17307f,0 3px 6px #0007}
.btn.o{background:linear-gradient(180deg,#ffb04d,var(--org2));box-shadow:0 5px 0 #7d3d00,0 10px 16px #0007}.btn.o:active{box-shadow:0 1px 0 #7d3d00}
.btn.g{background:linear-gradient(180deg,#3fdc9b,#16996a);box-shadow:0 5px 0 #0b6446,0 10px 16px #0007}.btn.g:active{box-shadow:0 1px 0 #0b6446}
.btn.r{background:linear-gradient(180deg,#ff7384,#c82a40);box-shadow:0 5px 0 #7a1423,0 10px 16px #0007}.btn.r:active{box-shadow:0 1px 0 #7a1423}
.btn.d{background:linear-gradient(180deg,#34437f,#222f66);box-shadow:0 5px 0 #121b44,0 10px 16px #0007}.btn.d:active{box-shadow:0 1px 0 #121b44}
.btn.s{padding:7px 12px;font-size:12px;border-radius:10px;box-shadow:0 3px 0 #17307f,0 5px 8px #0007}
.btn.s.r{box-shadow:0 3px 0 #7a1423,0 5px 8px #0007}.btn.s.g{box-shadow:0 3px 0 #0b6446,0 5px 8px #0007}.btn.s.d{box-shadow:0 3px 0 #121b44,0 5px 8px #0007}.btn.s.o{box-shadow:0 3px 0 #7d3d00,0 5px 8px #0007}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.link{color:#ffb36b;cursor:pointer;font-size:13px;text-decoration:underline}
/* cards */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 26px #0006}
.card h2,.card h3{margin:0 0 12px}
.sec{margin:34px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec h2{margin:0;font-size:24px}.sec small{color:var(--mut)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;padding:30px 0 10px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.hero .col{font-weight:700;letter-spacing:2px;color:#ffcf99;font-size:clamp(12px,2.4vw,16px);text-transform:uppercase}
.hero h1{font-size:clamp(50px,11vw,104px);margin:6px 0 8px;line-height:1;font-weight:900;letter-spacing:3px;background:linear-gradient(180deg,#fff7df 0%,#ffc470 40%,#ff7a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7d3d00) drop-shadow(0 10px 14px #000b);-webkit-text-stroke:1px #ffe2b3}
.hero p{color:var(--mut);font-size:16px;max-width:560px}
.cd{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.cd div{background:linear-gradient(180deg,#1d2c6d,#121c4c);border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:center;box-shadow:0 5px 0 #0a1233}
.cd b{display:block;font-size:26px}.cd span{font-size:11px;color:var(--mut)}
.scene{perspective:900px;width:190px;height:190px;margin:36px auto 44px}
.hero>div{position:relative}.hero>div:first-child{z-index:3}.hero>div:last-child{z-index:1;display:grid;place-items:center;min-height:300px}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 16s linear infinite}
.cube div{position:absolute;inset:0;display:grid;place-items:center;font-size:68px;border:2px solid #ffffff40;border-radius:20px;background:linear-gradient(135deg,#3d6bffcc,#ff8a1fcc);box-shadow:inset 0 0 40px #0006}
.cube .f1{transform:translateZ(95px)}.cube .f2{transform:rotateY(90deg) translateZ(95px)}.cube .f3{transform:rotateY(180deg) translateZ(95px)}.cube .f4{transform:rotateY(-90deg) translateZ(95px)}.cube .f5{transform:rotateX(90deg) translateZ(95px)}.cube .f6{transform:rotateX(-90deg) translateZ(95px)}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
/* event cards */
.ev{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,#1a2865,#121c4f);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 5px 0 #0a1233;transition:transform .15s}
.ev:hover{transform:translateY(-3px) rotateX(4deg)}
.ev .ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:#ffffff14;display:grid;place-items:center;flex:none}
.ev .nm{font-weight:600;font-size:15px}.ev .sm{font-size:11px;color:var(--mut)}
.ev .rt{margin-left:auto;text-align:right}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.st.o{background:#27c78329;color:#5bf0b0}.st.c{background:#ff4d6329;color:#ff8d9b}
/* forms */
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px;font-weight:500}
input,select,textarea{width:100%;background:#0a1238;border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px 12px;font:14px Poppins,sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--org);box-shadow:0 0 0 3px #ff8a1f33}
input[type=checkbox]{width:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tab{padding:9px 16px;border-radius:12px;background:#0d1740;border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);box-shadow:0 3px 0 #060c24;white-space:nowrap;user-select:none}
.tab.on{background:linear-gradient(180deg,#ffb04d,var(--org2));color:#fff;border-color:transparent}
.authbox{max-width:620px;margin:20px auto}
.photo{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#0a1238;border:3px solid var(--org);display:grid;place-items:center;font-size:36px;overflow:hidden;flex:none}
.photo img{width:100%;height:100%;object-fit:cover}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prof .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;flex:1;min-width:240px}
.kv small{color:var(--mut);display:block;font-size:11px}.kv b{font-size:14px}
.banner{padding:12px 16px;border-radius:14px;font-size:13px;margin-bottom:14px;font-weight:500}
.banner.ok{background:#27c7831f;border:1px solid #27c78366}.banner.no{background:#ff4d631f;border:1px solid #ff4d6366}.banner.wn{background:#ff8a1f1f;border:1px solid #ff8a1f66}
/* team picker */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.tcard{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#0c1640;box-shadow:0 4px 0 #060c24;transition:.12s}
.tcard:active{transform:translateY(3px);box-shadow:0 1px 0 #060c24}
.tcard.on{border-color:var(--org);background:linear-gradient(180deg,#2a2a5c,#1b2358)}
.tcard small{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.tcard b{display:block;font-size:14px;margin:2px 0 8px}
.tcard i{font-style:normal;font-size:13px;color:#ffd0a1;font-weight:600}
.tcard .yb{float:right;font-size:10px;background:#27c78333;color:#5bf0b0;padding:2px 8px;border-radius:99px;font-weight:700}
/* admin */
.adm{display:grid;grid-template-columns:210px 1fr;gap:16px}
@media(max-width:900px){.adm{grid-template-columns:1fr}}
.adm>*{min-width:0}
.side{display:flex;flex-direction:column;gap:8px}
@media(max-width:900px){.side{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.side .tab{text-align:left}
.stat{background:linear-gradient(180deg,#1d2c6d,#121c4c);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 5px 0 #0a1233}
.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px}
.bar i{display:block;height:14px;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--org));min-width:4px;box-shadow:0 2px 0 #0006}
.bar span{min-width:150px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw{overflow:auto;border-radius:14px;border:1px solid var(--line);max-height:62vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#0e1a52;text-align:left;padding:10px;font-size:12px;color:#cfe0ff;white-space:nowrap;z-index:1}
td{padding:9px 10px;border-top:1px solid #22307a;white-space:nowrap}
tr:hover td{background:#ffffff08}
.sw{position:relative;width:48px;height:26px;display:inline-block;flex:none}
.sw input{display:none}.sw s{position:absolute;inset:0;background:#3a1b25;border-radius:99px;cursor:pointer;transition:.2s;box-shadow:inset 0 2px 4px #0008}
.sw s:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+s{background:var(--grn)}.sw input:checked+s:before{transform:translateX(22px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gal .it{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0a1238;position:relative}
.gal img{width:100%;height:140px;object-fit:cover;display:block}
.gal .cap{padding:8px 10px;font-size:12px;color:var(--mut)}
/* notices */
.notice{display:flex;gap:14px;background:linear-gradient(180deg,#18265f,#111a48);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 5px 0 #0a1233}
.notice.Important{border-left-color:var(--org)}.notice.Urgent{border-left-color:var(--red)}
.notice .ni{font-size:26px;flex:none}
.notice h4{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notice p{margin:0 0 6px;color:#d6defa;font-size:13.5px;white-space:pre-wrap}
.notice small{color:var(--mut);font-size:11px}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:#3d6bff33;color:#9db7ff;text-transform:uppercase;letter-spacing:.5px}
.tag.Important{background:#ff8a1f33;color:#ffb36b}.tag.Urgent{background:#ff4d6333;color:#ff8d9b}
.newb{font-size:9px;font-weight:800;color:#fff;background:var(--red);padding:2px 7px;border-radius:5px;letter-spacing:.8px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
/* modal & toast */
#modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:100;padding:14px}
#modal.on{display:grid}
#modal .box{width:min(520px,100%);max-height:92vh;overflow:auto}
#modal .box.big{width:min(760px,100%)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#0b1230;border:1px solid var(--org);padding:11px 18px;border-radius:13px;font-size:13px;z-index:200;opacity:0;transition:.25s;box-shadow:0 10px 24px #000a;max-width:92vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
/* footer */
footer{margin-top:44px;border-top:1px solid var(--line);background:linear-gradient(180deg,#0b1334,#070d26)}
footer .in{max-width:1250px;margin:auto;padding:30px 18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
footer img{width:96px;height:96px;border-radius:50%;border:4px solid var(--org);box-shadow:0 6px 0 #7d3d00,0 12px 20px #0009;flex:none;object-fit:cover}
footer h3{margin:0;font-size:clamp(18px,3.4vw,28px);letter-spacing:.8px;line-height:1.15}
footer h3 span{color:#ffd37a;display:block}
footer .ln{display:flex;gap:10px;margin-top:10px;font-size:14px;color:#e3e9ff;line-height:1.5}
footer .ln b{flex:none}
footer a{text-decoration:none}
footer .ln:empty{display:none}
.mut{color:var(--mut)}.hide{display:none!important}

/* help button */
#helpFab{position:fixed;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;border:0;cursor:grab;z-index:90;font:800 28px Poppins,sans-serif;color:#fff;background:linear-gradient(180deg,#ffb04d,var(--org2));box-shadow:0 6px 0 #7d3d00,0 12px 20px #000a;touch-action:none;user-select:none;-webkit-user-select:none;display:none;place-items:center;padding:0}
#helpFab.on{display:grid}#helpFab:active{cursor:grabbing}
.qcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:#0d1640}.qcard.dn{opacity:.55}
.qb{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#ff8a1f33;color:#ffcf99}.qb.q{background:#3d6bff33;color:#b9c9ff}
.qcard .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px;font-size:13px;margin-top:8px}
.qcard .kv span{color:var(--mut)}
.pwv{font-family:monospace;letter-spacing:1px}
.hf label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
</style>
</head>

function fresh(){return{footer:{...DEF_FOOTER},logo:'',college:'Government Polytechnic Araria',tagline:'Celebrating Talent • Teamwork • Spirit',branches:['Civil Engineering','Computer Science & Engineering','Electrical Engineering','Electronics Engineering','Mechanical Engineering'],users:{},years:{'2026':newYear('UMANG 2026')},active:'2026',admin:{id:INSTITUTE_ID,pass:hsh(INSTITUTE_PASS),rv:ADMIN_RESET},queries:{}}}
function normalize(d){
  const f=fresh();d.users=d.users||{};d.years=d.years&&Object.keys(d.years).length?d.years:f.years;
  d.branches=Array.isArray(d.branches)&&d.branches.length?d.branches:f.branches;d.college=d.college||f.college;d.tagline=d.tagline??f.tagline;d.footer=Object.assign({},f.footer,d.footer||{});d.logo=d.logo||'';
  if(!d.admin||!d.admin.id||d.admin.rv!==ADMIN_RESET)d.admin=f.admin;d.queries=(d.queries&&typeof d.queries==='object')?d.queries:{};

function flat(d){
  const o={};o.meta={footer:d.footer,logo:d.logo||'',college:d.college,tagline:d.tagline,branches:d.branches,active:d.active,admin:d.admin,demoSeeded:!!d.demoSeeded};

  Object.entries(d.queries||{}).forEach(([k,q])=>o['queries/'+k]=q);
  Object.entries(d.years).forEach(([y,Yr])=>{o[`years/${y}/meta`]={title:Yr.title,start:Yr.start,end:Yr.end,deadline:Yr.deadline,regOpen:Yr.regOpen};
    Yr.events.forEach(e=>o[`years/${y}/events/${e.id}`]=e);Yr.regs.forEach(r=>o[`years/${y}/regs/${r.id}`]=r);Yr.notices.forEach(n=>o[`years/${y}/notices/${n.id}`]=n);Yr.gallery.forEach(g=>o[`years/${y}/gallery/${g.id}`]=g)});
  return o;
}
function fromRemote(r){
  const m=r.meta||{},d={footer:m.footer,logo:m.logo,college:m.college,tagline:m.tagline,branches:m.branches,active:m.active,admin:m.admin,demoSeeded:m.demoSeeded,users:r.users||{},queries:r.queries||{},years:{}};

  if(Array.isArray(d.branches)===false&&d.branches)d.branches=Object.values(d.branches);
  return normalize(d);
}

  pushing=true;
  try{do{again=false;const cur=flat(db),patch={};
    new Set([...Object.keys(cur),...Object.keys(lastFlat)]).forEach(k=>{if(JSON.stringify(cur[k])!==JSON.stringify(lastFlat[k]))patch[k]=cur[k]===undefined?null:cur[k]});
    if(Object.keys(patch).length){const r=await fetch(CLOUD+'/umang.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});if(!r.ok)throw new Error('push');lastFlat=cur}
  }while(again);setSync('ok')}catch(e){setSync('err')}
  pushing=false;
}
async function pullRemote(){const r=await fetch(CLOUD+'/umang.json',{cache:'no-store'});if(!r.ok)throw new Error('pull');return r.json()}
function safeToRerender(){return !$('#modal').classList.contains('on')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')}
function rerender(){({home:renderHome,auth:()=>{},student:renderStudent,admin:renderAdmin})[cur]();nav()}
async function cloudBoot(){
  setSync('wait');
  try{
    const data=await pullRemote();
    if(data&&data.meta){const local=db;db=fromRemote(data);lastFlat=flat(db);cloudReady=true;
      /* keep items created on this device during this session (offline) so they are not lost */
      Object.entries(local.users||{}).forEach(([k,u])=>{if(!db.users[k]&&(u.created||0)>=T0)db.users[k]=u});
      Object.entries(local.queries||{}).forEach(([k,q])=>{if(!db.queries[k]&&(q.ts||0)>=T0)db.queries[k]=q});
      Object.entries(local.years||{}).forEach(([yk,ly])=>{const ry=db.years[yk];if(!ry)return;const have=new Set(ry.regs.map(r=>r.id));ly.regs.forEach(r=>{if(!have.has(r.id)&&r.ts>=T0&&db.users[r.uid])ry.regs.push(r)})});
      try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
    else{cloudReady=true;lastFlat={};purgeDemo();await push()}
    purgeDemo();adminYear=db.active;setSync('ok');
    if(sess?.role==='student'&&!db.users[sess.uid]){sess=null;saveSess()}
    if(cur==='auth'&&authTab==='create'){/*keep form*/}else if(cur!=='auth')rerender();
  }catch(e){setSync('err')}
  if(!pollOn){pollOn=true;setInterval(poll,10000);window.addEventListener('focus',poll)}
}
async function poll(){
  if(!CLOUD)return;
  if(!cloudReady){await cloudBoot();return}   /* first connection failed, so try again */
  try{
    const pending=JSON.stringify(flat(db))!==JSON.stringify(lastFlat);
    if(pending){await push();return}
    const data=await pullRemote();if(!data||!data.meta){setSync('ok');return}
    const nd=fromRemote(data),nf=flat(nd);
    if(JSON.stringify(nf)!==JSON.stringify(lastFlat)){
      db=nd;lastFlat=nf;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
      if(sess?.role==='student'&&!db.users[sess.uid]){sess=null;saveSess();go('home')}
      else if(safeToRerender())rerender();
    }
    setSync('ok');
  }catch(e){setSync('err')}
}

function addReg(eventId,team,role,tb){
  const y=Y(),ev=y.events.find(e=>e.id===eventId);
  if(!ev||!regsOpen(ev))return toast('Registration closed');
  if(y.regs.some(r=>r.uid===sess.uid&&r.eventId===eventId))return toast('Already registered');
  y.regs.push({id:rid(),uid:sess.uid,eventId,team,role,tb:tb||'',ts:Date.now()});
  if(save()){closeModal();toast('Registered for '+ev.name+' ✅');renderStudent()}
}
function withdraw(id){
  if(!confirm('Withdraw from this event?'))return;
  const y=Y();y.regs=y.regs.filter(r=>r.id!==id);save();toast('Withdrawn');renderStudent();
}
function buildSlip(u,y,mine){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});

  doc.setDrawColor(...NAVY);doc.setLineWidth(1.2);doc.rect(8,8,194,281);doc.setDrawColor(...ORG);doc.setLineWidth(.35);doc.rect(11,11,188,275);
  doc.setFillColor(...NAVY);doc.rect(11,11,188,44,'F');doc.setFillColor(...ORG);doc.rect(11,55,188,2,'F');
  try{doc.addImage($('.brand img').src,imgFmt($('.brand img').src),17,16,34,34)}catch(e){}
  doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(17);doc.text(db.college.toUpperCase(),128,29,{align:'center'});
  doc.setFont('helvetica','normal');doc.setFontSize(9);if(al[0])doc.text(al[0],128,36,{align:'center'});if(al[1])doc.text(al[1],128,41,{align:'center'});
  doc.setTextColor(...NAVY);doc.setFont('helvetica','bold');doc.setFontSize(38);doc.text(y.title.toUpperCase(),105,80,{align:'center'});
  doc.setFontSize(12.5);doc.setTextColor(...ORG);doc.text('REGISTRATION CONFIRMATION CERTIFICATE',105,90,{align:'center'});
  if(y.start){doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(90);doc.text('Fest dates: '+fmtD(y.start)+(y.end&&y.end!==y.start?' to '+fmtD(y.end):''),105,96,{align:'center'})}
  doc.setTextColor(60);doc.setFont('helvetica','italic');doc.setFontSize(11);doc.text('This is to certify that',105,108,{align:'center'});
  doc.setTextColor(...NAVY);doc.setFont('helvetica','bold');doc.setFontSize(21);doc.text(u.name,105,119,{align:'center'});
  const nw=Math.min(150,doc.getTextWidth(u.name)+10);doc.setDrawColor(...ORG);doc.setLineWidth(.5);doc.line(105-nw/2,122,105+nw/2,122);
  doc.setTextColor(60);doc.setFont('helvetica','normal');doc.setFontSize(10.5);
  doc.text(doc.splitTextToSize('has successfully registered for the following event(s) at '+y.title+', '+db.college+'.',170),105,130,{align:'center'});
  const regNo='UMG'+yr.slice(-2)+'-'+abbr(u.branch).toUpperCase()+'-'+u.roll;
  const det=[['Roll No.',u.roll],['Branch',u.branch],['Semester',u.sem],['Session',u.batch],['Mobile',u.mobile],['Email',u.email],['Registration No.',regNo],['User ID',u.uid],['Password',u.plain||'-'],['Date',new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})]];
  let dy=146;
  det.forEach(([a,b],i)=>{const x=i%2?95:20;if(i%2===0&&i)dy+=9;doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...NAVY);doc.text(a+':',x,dy);doc.setFont('helvetica','normal');doc.setTextColor(30);doc.text(doc.splitTextToSize(String(b||'-'),52)[0],x+(i%2?28:28),dy)});
  if(u.photo){try{doc.setDrawColor(...ORG);doc.setLineWidth(.6);doc.rect(163,142,28,34);doc.addImage(u.photo,imgFmt(u.photo),163.5,142.5,27,33)}catch(e){}}
  const body=mine.map((r,i)=>{const e=y.events.find(x=>x.id===r.eventId);return[i+1,e?e.name:'',e?e.cat:'',r.team?r.team+' ('+r.role+')':'-']});
  let endY=194;
  if(doc.autoTable){doc.autoTable({startY:194,head:[['#','Event','Category','Team / Role']],body,theme:'grid',margin:{left:18,right:18},headStyles:{fillColor:NAVY,halign:'center'},styles:{fontSize:10,cellPadding:2.2},alternateRowStyles:{fillColor:[234,240,255]},columnStyles:{0:{halign:'center',cellWidth:12}}});endY=doc.lastAutoTable.finalY}
  const ty=endY+10;doc.setFont('helvetica','italic');doc.setFontSize(9.5);doc.setTextColor(...NAVY);
  const tl=doc.splitTextToSize('Thank you for registering for '+y.title+'! Every great performance begins with the courage to take part. Play fair, give your best and make '+db.college+' proud.  - '+db.college,160);
  doc.text(tl,105,ty,{align:'center'});
  const sy=Math.min(Math.max(ty+tl.length*5+14,252),266);
  doc.setDrawColor(60);doc.setLineWidth(.3);doc.line(22,sy,72,sy);doc.line(138,sy,188,sy);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(60);doc.text('Event Coordinator',47,sy+5,{align:'center'});doc.text('Principal',163,sy+5,{align:'center'});

  return doc;
}

let mailT=null;
function scheduleMail(){clearTimeout(mailT);const uid=sess.uid,demo=!(EMAILJS.service&&EMAILJS.template&&EMAILJS.key);mailT=setTimeout(()=>sendRegMail(uid),2500)}
async function sendRegMail(uid){
  const u=db.users[uid],y=Y();if(!u||!window.jspdf)return;
  const mine=y.regs.filter(r=>r.uid===uid);if(!mine.length)return;
  const doc=buildSlip(u,y,mine),fn='Umang_Registration_'+u.roll+'.pdf';
  const list=mine.map((r,i)=>{const e=y.events.find(x=>x.id===r.eventId);return(i+1)+'. '+(e?e.name:'')+(r.team?' - '+r.team+' ('+r.role+')':'')}).join('\n');
  const msg=`Hello ${u.name},\n\nYour registration for ${y.title} is confirmed.\n\nEvents:\n${list}\n\nYour confirmation PDF is attached.\n\nThank you for registering! Every great performance begins with the courage to take part. Play fair, give your best and make ${db.college} proud.\n\n${db.college}`;
  const r=await sendMail(u.email,u.name,y.title+' — Registration Confirmation',msg,doc.output('datauristring'));
  if(r==='demo'){toast('Registered ✅ — download your PDF with the "⬇ Confirmation PDF" button on your dashboard')}
  else toast(r==='sent'?'Confirmation PDF sent to your email ✅':'Could not send the email. Please download the PDF from your dashboard.');
}

  $('#tmBox').innerHTML=`<h4 style="margin:18px 0 4px">👥 Teams (one per branch)</h4><p class="mut" style="font-size:12px;margin:0 0 8px">Remove the teams of branches that have no team. Use the buttons below to bring them back. You can also add a team for a new branch/group.</p>
  <div class="grid g2">${EDT.items.map((x,i)=>`<div style="background:#0c1640;border:1px solid var(--line);border-radius:12px;padding:10px 12px"><div class="row" style="justify-content:space-between"><b style="color:#ffd0a1;font-size:14px">🏫 ${esc(x.b)}</b><button class="btn s r" onclick="tmRemove(${i})">Remove</button></div><label style="margin-top:6px">${esc(x.b)} team name</label><input value="${esc(x.name)}" oninput="EDT.items[${i}].name=this.value"></div>`).join('')||'<p class="mut">Koi team nahi hai.</p>'}</div>
  ${EDT.skipped.length?`<p class="mut" style="font-size:12px;margin:14px 0 6px">Removed teams — tap to bring back:</p><div class="row">${EDT.skipped.map((b,i)=>`<button class="btn s g" onclick="tmBack(${i})">＋ ${esc(b)}</button>`).join('')}</div>`:''}
  <div style="background:#0c1640;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:14px"><b>➕ Add a new team</b><div class="fg"><div><label>Branch / group name</label><input id="nt_b" placeholder="e.g. Civil Engineering"></div><div><label>Team name</label><input id="nt_n"></div></div><button class="btn s o" style="margin-top:10px" onclick="tmAdd()">Add Team</button></div>`;

function tmRemove(i){const x=EDT.items[i];if(!x.custom)EDT.skipped.push(x.b);EDT.items.splice(i,1);drawTeams()}
function tmBack(i){const b=EDT.skipped.splice(i,1)[0];EDT.items.push({b,name:`${abbr(b)} ${val('ee_name')||'Event'} Team`});drawTeams()}
function tmAdd(){
  const b=sanB(val('nt_b')),n=val('nt_n');if(!b||!n)return toast('Enter both the branch and the team name');
  EDT.skipped=EDT.skipped.filter(x=>x!==b);
  const f=EDT.items.find(x=>x.b===b);if(f)f.name=n;else EDT.items.push({b,name:n,custom:!teamBranches().includes(b)});
  drawTeams();
}
function saveEv(id){
  const e=AY().events.find(x=>x.id===id),n=val('ee_name');if(!n)return toast('Name cannot be empty');
  e.name=n;e.cat=val('ee_cat');e.team=val('ee_team')==='1';e.icon=val('ee_icon')||iconFor(n);
  e.teams={};e.skip={};
  EDT.items.forEach(x=>{e.teams[x.b]=(x.name||'').trim()||`${abbr(x.b)} ${n} Team`});
  EDT.skipped.forEach(b=>{e.skip[b]=true});
  save();closeModal();toast('Saved ✅');admEvents();
}

function changeCreds(){

  if(id.length<3)return toast('ID must be at least 3 characters');

function backup(){download(new Blob([JSON.stringify(db)],{type:'application/json'}),'umang_backup_'+new Date().toISOString().slice(0,10)+'.json')}
function restore(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.years||!d.users)throw 0;if(!confirm('Current data will be replaced. Continue?'))return;db=normalize(d);adminYear=db.active;save();toast('Restored ✅');renderAdmin();nav()}catch(e){toast('Invalid backup file')}};fr.readAsText(f)}
function newSession(){
  const yr=prompt('New session year? (e.g. 2027)');if(!yr)return;
  if(!/^[A-Za-z0-9_-]+$/.test(yr))return toast('Use only letters and numbers');
  if(db.years[yr])return toast('This session already exists');
  db.years[yr]=newYear('UMANG '+yr,AY().events.map(e=>({...e,open:true,teams:{...e.teams},skip:{...(e.skip||{})}})),false);
  db.active=yr;adminYear=yr;save();toast('UMANG '+yr+' created. Set the dates in Settings.');adminTab='settings';renderAdmin();nav();
}

function seedDemo(){
  if(db.demoSeeded)return;
  const b=db.branches,mk=(uid,name,roll,branch,sem,mobile)=>({uid,name,roll,branch,sem:String(sem),batch:'2024-27',mobile,email:uid+'@demo.com',photo:'',pass:hsh('1234'),created:Date.now(),demo:true});
  const U=[mk('student1','Rahul Kumar','12',b[1]||'CSE',5,'9876543210'),mk('student2','Aman Raj','07',b[4]||'Mechanical',3,'9876543211'),mk('student3','Priya Kumari','21',b[3]||'Electronics',5,'9876543212'),mk('student4','Sonu Yadav','33',b[0]||'Civil',1,'9876543213'),mk('student5','Neha Singh','05',b[1]||'CSE',3,'9876543214')];
  U.forEach(u=>{if(!db.users[u.uid])db.users[u.uid]=u});
  const y=Y(),find=n=>y.events.find(e=>e.name.toLowerCase()===n);
  [['student1','cricket','Captain'],['student1','chess',''],['student1','debate',''],['student2','cricket','Player'],['student2','kabaddi','Captain'],['student3','badminton',''],['student3','singing',''],['student4','volleyball','Player'],['student5','cricket','Player'],['student5','dance','']]
   .forEach(([uid,en,role])=>{const ev=find(en);if(!ev||y.regs.some(r=>r.uid===uid&&r.eventId===ev.id))return;const u=db.users[uid];y.regs.push({id:rid(),uid,eventId:ev.id,team:ev.team?teamName(ev,u.branch):'',role:ev.team?role:'',tb:ev.team?u.branch:'',ts:Date.now()-Math.floor(Math.random()*864e5)})});
  db.demoSeeded=true;save();
}
function purgeDemo(){
  const ids=Object.values(db.users).filter(u=>u.demo).map(u=>u.uid);
  if(ids.length){ids.forEach(id=>delete db.users[id]);Object.values(db.years).forEach(y=>y.regs=y.regs.filter(r=>!ids.includes(r.uid)))}
  if(ids.length||!db.demoSeeded){db.demoSeeded=true;save()}
}
function removeDemo(){
  if(!confirm('Remove all demo students and their registrations?'))return;
  const ids=Object.values(db.users).filter(u=>u.demo).map(u=>u.uid);
  ids.forEach(id=>delete db.users[id]);Object.values(db.years).forEach(y=>y.regs=y.regs.filter(r=>!ids.includes(r.uid)));
  save();toast('Demo data removed');renderAdmin();nav();
}

function groupByBranch(rows){const g={};rows.forEach(x=>(g[x.u.branch]=g[x.u.branch]||[]).push(x));return Object.entries(g).sort((a,b)=>db.branches.indexOf(a[0])-db.branches.indexOf(b[0]))}
function filterText(){const y=AY(),p=[];if(F.ev)p.push('Event: '+y.events.find(e=>e.id===F.ev)?.name);if(F.br)p.push('Branch: '+F.br);if(F.sem)p.push('Semester: '+F.sem);return p.length?p.join(' | '):'All events, all branches'}
function matrix(rows){const y=AY(),brs=groupByBranch(rows).map(g=>g[0]);const evs=[...new Set(rows.map(x=>x.ev.id))].map(id=>y.events.find(e=>e.id===id));
  const body=evs.map(ev=>{const c=brs.map(b=>rows.filter(x=>x.ev.id===ev.id&&x.u.branch===b).length);return[ev.name,...c,c.reduce((a,b)=>a+b,0)]});
  const tot=brs.map((b,i)=>body.reduce((s,r)=>s+r[i+1],0));return{head:['Event',...brs,'Total'],body,foot:['TOTAL',...tot,tot.reduce((a,b)=>a+b,0)]}}

function groupStudents(rows){
  const map=new Map();
  rows.forEach(x=>{if(!map.has(x.u.uid))map.set(x.u.uid,{u:x.u,items:[]});map.get(x.u.uid).items.push(x)});
  const byB={};
  [...map.values()].forEach(g=>{g.items.sort((a,b)=>a.r.ts-b.r.ts);(byB[g.u.branch]=byB[g.u.branch]||[]).push(g)});
  return Object.entries(byB).sort((a,b)=>db.branches.indexOf(a[0])-db.branches.indexOf(b[0])).map(([br,l])=>[br,l.sort((a,b)=>nat(a.u.sem,b.u.sem)||nat(a.u.roll,b.u.roll)||nat(a.u.name,b.u.name))]);
}

const COLS=['#','Name','Roll No.','Branch','Semester','Session','Mobile','Email','Event','Category','Team Name','Role','Registered On'];
const rowVals=({r,u,ev},i)=>[i+1,u.name,u.roll,u.branch,u.sem,u.batch||'-',u.mobile,u.email||'-',ev.name,ev.cat,r.team||'-',r.role||'-',fmtTS(r.ts)];

async function exportExcel(){
  if(!window.ExcelJS)return toast('Excel library could not load (internet required)');
  const rows=filtered();if(!rows.length)return toast('No registrations to export');
  const y=AY(),wb=new ExcelJS.Workbook();wb.creator=db.college;wb.created=new Date();
  const NAVY='FF0E2064',ORG='FFFF8A1F',thin={style:'thin',color:{argb:'FF9AA8D8'}},bd={top:thin,left:thin,bottom:thin,right:thin};
  const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}});
  const NC=COLS.length,WID=[6,26,12,30,10,12,14,30,22,12,30,12,22],CEN=[1,3,5,6,7,10,12,13];
  const title=(ws,n,sub)=>{
    ws.mergeCells(1,1,1,n);const a=ws.getCell(1,1);a.value=db.college.toUpperCase();a.font={bold:true,size:16,color:{argb:'FFFFFFFF'}};a.alignment={horizontal:'center',vertical:'middle'};a.fill=fill(NAVY);ws.getRow(1).height=30;
    ws.mergeCells(2,1,2,n);const b=ws.getCell(2,1);b.value=y.title+' — '+sub;b.font={bold:true,size:12,color:{argb:'FFFFFFFF'}};b.alignment={horizontal:'center',vertical:'middle'};b.fill=fill(ORG);ws.getRow(2).height=22;
    ws.mergeCells(3,1,3,n);const c=ws.getCell(3,1);c.value='Filter: '+filterText()+'   |   Generated: '+new Date().toLocaleString('en-IN');c.font={italic:true,size:9,color:{argb:'FF555555'}};c.alignment={horizontal:'center'};
  };
  const page=(ws,hr)=>{ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:hr+':'+hr,margins:{left:.3,right:.3,top:.5,bottom:.5,header:.2,footer:.2}};ws.headerFooter={oddFooter:'&LPage &P of &N&R'+db.college}};
  const table=(ws,list,sub)=>{
    title(ws,NC,sub);
    const h=ws.getRow(5);h.values=COLS;h.height=26;
    h.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'},size:11};c.fill=fill(NAVY);c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=bd});
    list.forEach((x,i)=>{const row=ws.addRow(rowVals(x,i));row.height=19;
      row.eachCell({includeEmpty:true},(c,ci)=>{c.border=bd;c.alignment={vertical:'middle',horizontal:CEN.includes(ci)?'center':'left'};if(i%2)c.fill=fill('FFEAF0FF')})});
    WID.forEach((w,i)=>ws.getColumn(i+1).width=w);
    ws.autoFilter={from:{row:5,column:1},to:{row:5,column:NC}};
    ws.views=[{state:'frozen',ySplit:5,xSplit:2,showGridLines:false}];
    page(ws,5);
  };
  /* 1) all registrations, with every detail */
  table(wb.addWorksheet('All Registrations'),rows,'All Registrations ('+rows.length+' entries)');
  /* 2) one sheet per branch */
  const used=new Set(['all registrations','summary']);
  groupByBranch(rows).forEach(([br,list])=>{
    let nm=br.replace(/[\\\/?*:\[\]]/g,'-').slice(0,31),k=2;while(used.has(nm.toLowerCase()))nm=nm.slice(0,28)+'-'+k++;used.add(nm.toLowerCase());
    table(wb.addWorksheet(nm),list,br+' — '+list.length+' entries');
  });
  /* 3) event x branch summary */
  const m=matrix(rows),ws0=wb.addWorksheet('Summary',{views:[{showGridLines:false}]});
  title(ws0,m.head.length,'Registration Summary');
  const h0=ws0.getRow(5);h0.values=m.head;h0.height=34;
  h0.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'},size:11};c.fill=fill(NAVY);c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=bd});
  m.body.forEach((r,i)=>{const row=ws0.addRow(r);row.eachCell((c,ci)=>{c.border=bd;c.alignment={horizontal:ci===1?'left':'center',vertical:'middle'};if(i%2)c.fill=fill('FFEAF0FF')})});
  const ft=ws0.addRow(m.foot);ft.eachCell((c,ci)=>{c.font={bold:true};c.border=bd;c.fill=fill('FFFFE2C2');c.alignment={horizontal:ci===1?'left':'center'}});
  ws0.getColumn(1).width=26;for(let i=2;i<=m.head.length;i++)ws0.getColumn(i).width=18;
  ws0.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0};
  const buf=await wb.xlsx.writeBuffer();
  download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),y.title.replace(/\s+/g,'_')+'_Registrations.xlsx');
  toast('Excel downloaded ✅');
}

function exportPDF(){
  if(!window.jspdf)return toast('PDF library could not load (internet required)');
  const rows=filtered();if(!rows.length)return toast('No registrations to export');
  const y=AY(),doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  if(!doc.autoTable)return toast('PDF table plugin could not load');
  const PW=297,NAVY=[14,32,100];let sub='';
  const head=()=>{doc.setFillColor(...NAVY);doc.rect(0,0,PW,20,'F');doc.setFillColor(255,138,31);doc.rect(0,20,PW,1.4,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(db.college.toUpperCase(),PW/2,8,{align:'center'});doc.setFontSize(10);doc.text(y.title+'  -  '+sub,PW/2,15,{align:'center'});doc.setTextColor(0)};
  const M={top:25,left:6,right:6,bottom:14};
  const HEAD=['#','Name','Roll No.','Branch','Sem','Session','Mobile','Email','Event','Category','Team Name','Role','Registered On'];
  const cs={0:{halign:'center',cellWidth:8},1:{cellWidth:30},2:{halign:'center',cellWidth:14},3:{cellWidth:28},4:{halign:'center',cellWidth:9},5:{halign:'center',cellWidth:16},6:{halign:'center',cellWidth:22},7:{cellWidth:38},8:{cellWidth:24},9:{halign:'center',cellWidth:16},10:{cellWidth:'auto'},11:{halign:'center',cellWidth:16},12:{halign:'center',cellWidth:24}};
  const tbl=(list,startY)=>doc.autoTable({theme:'grid',startY,margin:M,head:[HEAD],body:list.map((x,i)=>{const v=rowVals(x,i);return v}),
    headStyles:{fillColor:NAVY,textColor:255,halign:'center',fontSize:7.5,fontStyle:'bold'},styles:{fontSize:7,cellPadding:1.5,valign:'middle',overflow:'linebreak',lineColor:[154,168,216],lineWidth:.15},
    alternateRowStyles:{fillColor:[234,240,255]},columnStyles:cs,didDrawPage:head});
  const groups=groupByBranch(rows);
  groups.forEach(([br,list],gi)=>{
    if(gi)doc.addPage();
    sub=br+'  ('+list.length+' entries)  |  '+filterText();
    tbl(list,25);
  });
  /* summary page */
  doc.addPage();sub='Registration Summary';const m=matrix(rows);
  doc.autoTable({theme:'grid',startY:25,margin:M,head:[m.head],body:[...m.body,m.foot],headStyles:{fillColor:NAVY,textColor:255,halign:'center',fontSize:8},styles:{fontSize:8.5,cellPadding:1.8},alternateRowStyles:{fillColor:[234,240,255]},columnStyles:{0:{halign:'left',fontStyle:'bold'}},didDrawPage:head,didParseCell:d=>{if(d.row.index===m.body.length&&d.section==='body'){d.cell.styles.fontStyle='bold';d.cell.styles.fillColor=[255,226,194]}if(d.section==='body'&&d.column.index>0)d.cell.styles.halign='center'}});
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(110);doc.text('Generated on '+new Date().toLocaleString('en-IN'),6,205);doc.text('Page '+i+' of '+n,PW-6,205,{align:'right'})}
  doc.setPage(n);doc.setTextColor(0);doc.setFontSize(9);
  const fy=Math.min(doc.lastAutoTable.finalY+18,195);doc.line(15,fy,75,fy);doc.text('Sports / Event Coordinator',15,fy+5);doc.line(PW-75,fy,PW-15,fy);doc.text('Principal / HOD',PW-75,fy+5);
  doc.save(y.title.replace(/\s+/g,'_')+'_Registrations.pdf');toast('PDF downloaded ✅');
}

(function(){
  const f=document.createElement('button');f.id='helpFab';f.type='button';f.textContent='?';f.title='Help';f.setAttribute('aria-label','Help');document.body.appendChild(f);
  let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;
  f.addEventListener('pointerdown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;const r=f.getBoundingClientRect();ox=r.left;oy=r.top;try{f.setPointerCapture(e.pointerId)}catch(_){}});
  f.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<6)return;moved=true;
    const x=Math.min(innerWidth-f.offsetWidth,Math.max(0,ox+dx)),y=Math.min(innerHeight-f.offsetHeight,Math.max(0,oy+dy));
    f.style.left=x+'px';f.style.top=y+'px';f.style.right='auto';f.style.bottom='auto'});
  f.addEventListener('pointerup',()=>{if(drag&&!moved)helpMenu();drag=false});
  f.addEventListener('pointercancel',()=>{drag=false});
  addEventListener('resize',()=>{if(!f.style.left)return;const r=f.getBoundingClientRect();f.style.left=Math.max(0,Math.min(innerWidth-f.offsetWidth,r.left))+'px';f.style.top=Math.max(0,Math.min(innerHeight-f.offsetHeight,r.top))+'px'});
})();
function updateHelp(){const f=$('#helpFab');if(f)f.classList.toggle('on',cur!=='admin'&&sess?.role!=='admin')}
function helpMenu(){showModal(`<h3>❓ Help</h3><p class="mut" style="font-size:13px;margin-top:-6px">What do you need help with?</p>
  <div style="display:flex;flex-direction:column;gap:14px;margin-top:14px"><button class="btn o" onclick="helpForgot()">🔑 Forgot Password</button><button class="btn" onclick="helpQuery()">💬 Send Me Any Query</button><button class="btn d" onclick="closeModal()">Close</button></div>`)}
function helpFields(){return`<label>Full Name *</label><input id="h_n" autocomplete="name">
  <label>Registration / Roll No. *</label><input id="h_r">
  <label>Mobile Number *</label><input id="h_m" inputmode="numeric" maxlength="10">
  <label>Email ID *</label><input id="h_e" type="email">`}
function helpForgot(){showModal(`<div class="hf"><h3>🔑 Forgot Password</h3><p class="mut" style="font-size:13px;margin-top:-6px">Enter the same details you gave while creating your account.</p>${helpFields()}
  <div class="row" style="margin-top:16px"><button class="btn o" onclick="submitHelp('forgot')">Send</button><button class="btn d" onclick="helpMenu()">Back</button></div></div>`)}
function helpQuery(){showModal(`<div class="hf"><h3>💬 Send Me Any Query</h3>${helpFields()}
  <label>Your Query *</label><textarea id="h_q" rows="6" placeholder="Type your query here…"></textarea>
  <div class="row" style="margin-top:16px"><button class="btn o" onclick="submitHelp('query')">Send</button><button class="btn d" onclick="helpMenu()">Back</button></div></div>`,true)}
function submitHelp(kind){
  const q={id:rid(),type:kind,name:val('h_n'),roll:val('h_r'),mobile:val('h_m'),email:val('h_e').toLowerCase(),msg:kind==='query'?val('h_q'):'',ts:Date.now(),done:false};
  if(!q.name||!q.roll||!q.mobile||!q.email)return toast('Please fill all fields marked with *');
  if(!/^\d{10}$/.test(q.mobile))return toast('Mobile number must be 10 digits');
  if(!/^\S+@\S+\.\S+$/.test(q.email))return toast('Enter a valid email');
  if(kind==='query'&&!q.msg)return toast('Please write your query');
  db.queries=db.queries||{};db.queries[q.id]=q;
  if(!save())return;
  showModal(`<h3>✅ Request Sent</h3><div class="banner ok" style="margin-top:8px">${kind==='forgot'?'Your request has been received. Our support team is available 24x7 — you will get your password on your registered email within 24 hours.':'Your query has been sent to the institute. You will get a reply on your email within 24 hours.'}</div>
   <div class="row" style="margin-top:16px"><button class="btn" onclick="closeModal()">OK</button></div>`);
}
const pendQ=()=>Object.values(db.queries||{}).filter(q=>!q.done).length;
function findUserForQ(q){const e=(q.email||'').toLowerCase(),us=Object.values(db.users);
  return us.find(u=>(u.email||'').toLowerCase()===e)||us.find(u=>String(u.roll).toLowerCase()===String(q.roll).toLowerCase()&&u.mobile===q.mobile)||null}
function pwCell(u){return u.plain?`<span class="pwv" data-pw="${esc(u.plain)}">••••••</span> <button class="btn s d" onclick="togPw(this)" title="Show / hide">🙈</button>`:'<span class="mut">— (old account)</span>'}
function togPw(b){const s=b.previousElementSibling;if(b.dataset.on){s.textContent='••••••';b.textContent='🙈';delete b.dataset.on}else{s.textContent=s.dataset.pw;b.textContent='👁';b.dataset.on='1'}}
function admHelp(){
  const L=Object.values(db.queries||{}).sort((a,b)=>b.ts-a.ts);
  $('#admBody').innerHTML=`<div class="card"><h3>🆘 Student Help Desk</h3>
   <p class="mut" style="font-size:12px;margin-top:-6px">Forgot-password requests and student queries appear here. For a password request, check the student's details, then press "✉ Send Password" to email the login details to the student.</p>
   ${L.map(q=>{const fg=q.type==='forgot',u=fg?findUserForQ(q):null;
    return`<div class="qcard ${q.done?'dn':''}"><div class="row" style="justify-content:space-between"><span class="qb ${fg?'':'q'}">${fg?'🔑 Forgot Password':'💬 Query'}</span><small class="mut">${fmtTS(q.ts)}${q.done?' • ✅ Done':''}</small></div>
     <div class="kv"><div><span>Name</span><br><b>${esc(q.name)}</b></div><div><span>Mobile</span><br><b><a href="tel:${esc(q.mobile)}">${esc(q.mobile)}</a></b></div><div><span>Email</span><br><b>${esc(q.email)}</b></div><div><span>Registration / Roll No.</span><br><b>${esc(q.roll)}</b></div>
     ${fg?`<div><span>User ID</span><br><b>${u?esc(u.uid):'—'}</b></div>`:''}</div>
     ${fg?(u?`<label>Password (you can edit it before sending)</label><input class="pwv" id="pw_${q.id}" value="${esc(u.plain||'')}" placeholder="Type a password for this student" autocomplete="off"><small class="mut">Will be emailed to: ${esc(u.email)}</small>`:'<div class="banner no" style="margin-top:10px">No matching account found for these details.</div>'):''}
     ${q.msg?`<div style="margin-top:10px;white-space:pre-wrap;font-size:14px;background:#0a1233;border-radius:10px;padding:10px">${esc(q.msg)}</div>`:''}
     <div class="row" style="margin-top:12px">${fg?(u?`<button class="btn s g" onclick="sendPw('${q.id}')">✉ Send Password</button>`:''):`<button class="btn s g" onclick="mailQ('${q.id}')">✉ Reply by Email</button>`}
     <button class="btn s" onclick="qDone('${q.id}')">${q.done?'↩ Reopen':'✔ Mark Done'}</button><button class="btn s r" onclick="qDel('${q.id}')">Delete</button></div></div>`}).join('')||'<p class="mut" style="margin-top:14px">No requests yet.</p>'}</div>`;
}
async function sendPw(id){
  const q=db.queries[id];if(!q)return;const u=findUserForQ(q);if(!u)return toast('No matching account found');
  const pw=($('#pw_'+id)?.value||'').trim();
  if(pw.length<4)return toast('Password must be at least 4 characters');
  if(pw!==u.plain){u.pass=hsh(pw);u.plain=pw;delete u.tmp}   /* keep the account in sync with what is emailed */
  save();
  const sub=Y().title+' — Your password',
  body=`Hi ${u.name},\n\n${db.college}\n\nAs requested, here are your ${Y().title} portal login details:\n\nName: ${u.name}\nMobile: ${u.mobile}\nEmail: ${u.email}\nUser ID: ${u.uid}\nPassword: ${pw}\n\nPlease log in and change your password from your dashboard.\n\nRegards,\n${db.college}`;
  const r=await sendMail(u.email,u.name,sub,body);
  if(r==='sent'){q.done=true;save();toast('Password sent to '+u.email+' ✅');renderAdmin()}
  else if(r==='demo'){toast('Your mail app is opening — press Send there');location.href='mailto:'+encodeURIComponent(u.email).replace('%40','@')+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body)}
  else toast('Could not send the email. Please try again later.');
}
function mailQ(id){const q=db.queries[id];if(!q)return;
  const sub=Y().title+' — Reply to your query',body=`Hello ${q.name},\n\n\n\nRegards,\n${db.college}`;
  location.href='mailto:'+encodeURIComponent(q.email).replace('%40','@')+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body)}
function qDone(id){const q=db.queries[id];if(!q)return;q.done=!q.done;save();renderAdmin()}
function qDel(id){if(!confirm('Delete this request?'))return;delete db.queries[id];save();renderAdmin()}
/* quick switches: all sports / all cultural / whole UMANG */
function bulkHTML(y){
  const sp=y.events.filter(e=>e.cat==='Sports'),cu=y.events.filter(e=>e.cat==='Cultural');
  const row=(l,on,fn)=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid #22307a"><b>${l}</b><label class="sw" style="margin:0"><input type="checkbox" ${on?'checked':''} onchange="${fn}"><s></s></label></div>`;
  return`<div class="card"><h3>⚡ Quick Switches</h3><p class="mut" style="font-size:12px;margin-top:-6px">ON = students can register, OFF = closed.</p>
   ${row('🏆 Entire UMANG (all Sports + Cultural)',y.regOpen,'masterSet(this.checked)')}
   ${row('⚽ All Sports ('+sp.length+')',sp.length>0&&sp.every(e=>e.open),"bulkSet('Sports',this.checked)")}
   ${row('🎭 All Cultural ('+cu.length+')',cu.length>0&&cu.every(e=>e.open),"bulkSet('Cultural',this.checked)")}</div>`}
function masterSet(on){const y=AY();y.regOpen=on;save();toast(on?'UMANG registration ON ✅':'Entire UMANG closed ⛔');admEvents()}
function bulkSet(cat,on){AY().events.forEach(e=>{if(e.cat===cat)e.open=on});save();toast('All '+cat+(on?' opened ✅':' closed ⛔'));admEvents()}

/* ===================== START ===================== */
if(sess?.role==='student'&&!db.users[sess.uid]){sess=null;saveSess()}
purgeDemo();
go('home');
if(CLOUD)cloudBoot();
</script>
</body>
</html>
